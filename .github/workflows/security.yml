name: ⛑️ Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scan automatique chaque lundi à 08h00 (UTC)
    - cron: "0 8 * * 1"

jobs:

  # ─────────────────────────────────────────────
  # 1. Scan de secrets (tokens, clés API, etc.)
  # ─────────────────────────────────────────────
  secrets-scan:
    name: 🔑 Scan secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # Analyse uniquement les secrets confirmés (moins de faux positifs)
          extra_args: --only-verified

  # ─────────────────────────────────────────────
  # 2. Vulnérabilités des dépendances Python
  # ─────────────────────────────────────────────
  deps-audit:
    name: 📦 Audit dépendances Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer pip-audit
        run: pip install pip-audit

      - name: Auditer les dépendances
        run: pip-audit -r requirements.txt

  # ─────────────────────────────────────────────
  # 3. Détection de données sensibles dans les docs
  # ─────────────────────────────────────────────
  docs-sensitive-data:
    name: 📄 Détection données sensibles dans les docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recherche de patterns sensibles
        run: |
          echo "🔍 Recherche de patterns sensibles dans docs/..."
          FOUND=0

          # ── Mots de passe réels en clair ──────────────────────────────────
          # Exclusions :
          #   - lignes dans des blocs de code (commandes Cisco/Linux d'exemple)
          #   - mentions de gestionnaire de mots de passe
          #   - expressions "secret M0t..." qui sont des exemples documentés
          #   - lignes contenant "exemple", "example", "placeholder", commentaires #
          #   - pattern "enable secret / enable password" = commandes Cisco
          #   - "Base32 secret" / "Hex secret" = sorties TOTP pédagogiques
          PWD_HITS=$(grep -rn --include="*.md" \
            -iE '(password|mot de passe|passwd|mdp)\s*[:=]\s*[^[:space:]][^\n]{3,}' \
            docs/ 2>/dev/null \
            | grep -viE \
              'exemple|example|placeholder|gestionnaire|manager|voir|see|#|`[^`]*`|enable (secret|password)|secret\s+M0t|Base32|Hex secret|otpauth|protégé par' \
            | head -5 || true)

          if [ -n "$PWD_HITS" ]; then
            echo "$PWD_HITS"
            echo "❌ Mot de passe potentiel en clair détecté !"
            FOUND=1
          else
            echo "✅ Aucun mot de passe en clair détecté."
          fi

          # ── Clés API / tokens réels ───────────────────────────────────────
          # Exclusions :
          #   - "secret" au sens TOTP / Cisco / pédagogique
          #   - lignes dans des blocs de code d'exemple (MX2..., KYVW..., MX2DY4C4...)
          #   - lignes contenant des ellipses "..." (= troncature pédagogique)
          TOKEN_HITS=$(grep -rn --include="*.md" \
            -iE '(api[_-]?key|token)\s*[:=]\s*[a-zA-Z0-9_\-]{20,}' \
            docs/ 2>/dev/null \
            | grep -viE '\.\.\.|exemple|example|placeholder|#' \
            | head -5 || true)

          if [ -n "$TOKEN_HITS" ]; then
            echo "$TOKEN_HITS"
            echo "❌ Clé API / token potentiel détecté !"
            FOUND=1
          else
            echo "✅ Aucun token/clé API détecté."
          fi

          # ── Résultat final ────────────────────────────────────────────────
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Des données sensibles réelles ont été détectées dans les docs !"
            exit 1
          fi

          echo "✅ Scan terminé — aucune donnée sensible critique."

  # ─────────────────────────────────────────────
  # 4. Vérification du wrangler.toml (Cloudflare)
  # ─────────────────────────────────────────────
  cloudflare-config:
    name: ☁️ Validation config Cloudflare (wrangler.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence de wrangler.toml
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::error::wrangler.toml manquant — le déploiement Cloudflare va échouer !"
            exit 1
          fi
          echo "✅ wrangler.toml présent"

      - name: Vérifier la config assets dans wrangler.toml
        run: |
          if ! grep -q 'directory' wrangler.toml; then
            echo "::error::Pas de [assets] directory dans wrangler.toml !"
            exit 1
          fi
          echo "✅ Config assets OK"

      - name: Vérifier que requirements.txt est présent
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt manquant à la racine !"
            exit 1
          fi
          echo "✅ requirements.txt présent"

      - name: Vérifier la version de zensical dans requirements.txt
        run: |
          if ! grep -q "zensical" requirements.txt; then
            echo "::error::zensical absent de requirements.txt !"
            exit 1
          fi
          echo "✅ zensical présent dans requirements.txt"